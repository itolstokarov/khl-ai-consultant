<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат КХЛ</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; background: #1a1a1a; color: #fff; }
        #chat { height: 400px; border: 1px solid #444; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #222; }
        .msg { margin-bottom: 10px; padding: 8px; border-radius: 4px; max-width: 80%; line-height: 1.4; }
        .user { background: #007acc; margin-left: auto; text-align: right; }
        .ai { background: #333; }
        .input-panel { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; background: #333; color: #fff; border: 1px solid #444; }
        button { padding: 10px 20px; background: #007acc; color: #fff; border: none; cursor: pointer; }
        button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
        .ai-link { color: #00a2ff; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body>

    <div id="chat">
        <div class="msg ai">Привет! Я ИИ-консультант по КХЛ. О чем хочешь узнать?</div>
    </div>

    <div class="input-panel">
        <input type="text" id="text-input" placeholder="Введите вопрос...">
        <button id="send-btn">Отправить</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('text-input');
        const btn = document.getElementById('send-btn');

        function formatAIResponse(text) {
            let cleanText = text
                .replace(/\bID\s+\d+\b/gi, '')
                .replace(/\[SEP\]/g, '')
                .trim();

            cleanText = cleanText.replace(/\*\*([^*]+)\*\*/g, '<strong>\$1</strong>');

            let currentUrl = 'https://khl.ru';
            const markdownRegex = /\[([^\]]+)\]\((https?:\/\/[^\)]+|www\.[^\)]+)\)/gi;
            cleanText = cleanText.replace(markdownRegex, (match, title, url) => {
                currentUrl = url.startsWith('http') ? url : `https://${url}`;
                return `<a href="${currentUrl}" target="_blank" class="ai-link">${title}</a>`;
            });

            cleanText = cleanText.replace(/\.?\s*\[(\d+)\]/g, (match, number) => {
                return ` <a href="${currentUrl}" target="_blank" class="ai-link">[Источник ${number}]</a>`;
            });

            let lines = cleanText.split('\n');
            let formattedLines = lines.map(line => {
                let trimmed = line.trim();
                if (!trimmed) return '';

                let isListItem = false;
                if (trimmed.startsWith('*')) {
                    trimmed = trimmed.replace(/^\*\s*/, '');
                    isListItem = true;
                }

                if (isListItem) {
                    return `<div style="margin-left: 15px; margin-top: 5px; display: list-item; list-style-type: disc;">${trimmed}</div>`;
                }
                return `<div style="margin-bottom: 8px;">${trimmed}</div>`;
            });

            return formattedLines.join('');
        }

        function addMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            
            if (sender === 'ai') {
                div.innerHTML = formatAIResponse(text);
            } else {
                div.innerText = text;
            }
            
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function fetchWithRetry(message, retries = 3, delay = 1500) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch('/api/ask', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message })
                    });
                    if (response.ok) {
                        return await response.json();
                    }
                } catch (e) {
                    if (i === retries - 1) throw e;
                }
                await new Promise(res => setTimeout(res, delay));
            }
        }

        async function send() {
            const message = input.value.trim();
            if (!message) return;

            addMessage('user', message);
            input.value = '';
            input.disabled = true;
            btn.disabled = true;

            try {
                const data = await fetchWithRetry(message);
                addMessage('ai', data.answer);
            } catch (e) {
                addMessage('ai', 'Ошибка сети. Сервер долго отвечал, попробуйте еще раз.');
            } finally {
                input.disabled = false;
                btn.disabled = false;
                input.focus();
            }
        }

        btn.addEventListener('click', send);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    </script>
</body>
</html>
